<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the canvas reaches under the notch; the app is
         full-bleed and has no chrome of its own to keep clear of it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- No favicon, and no request for one: an unanswered /favicon.ico
         falls through to the site-wide 404.html, which is the Flutter
         client's index. -->
    <link rel="icon" href="data:," />
    <title>Guild Overseer - Bevy client</title>
    <style>
      :root { color-scheme: dark; }

      /* The page is a viewport onto the canvas, not a document: it never
         scrolls, and a drag that runs past an edge must not become a scroll
         gesture. Without `overscroll-behavior` a downward swipe on a phone
         triggers pull-to-refresh and reloads several MB of wasm. `position:
         fixed` pins the body so iOS cannot rubber-band it either. */
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #12141a;
        color: #c3c8d4;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body { position: fixed; inset: 0; }

      /* `touch-action: none` hands every touch to the app: no scrolling, no
         double-tap zoom, no pinch. `user-select` and `touch-callout` stop a
         long press from selecting or offering to copy the canvas. */
      #bevy-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #status {
        position: absolute; inset: 0;
        display: grid; place-content: center;
        text-align: center; padding: 1rem;
        pointer-events: none;
      }
      #status.gone { display: none; }
    </style>
  </head>
  <body>
    <canvas id="bevy-canvas"></canvas>
    <div id="status">
      <p>Loading the Bevy client…</p>
      <p>A few MB of WebAssembly. First load is the slow one.</p>
    </div>

    <!-- Relative, not absolute: this page is served from /<repo>/bevy/ on
         Pages and from / on a local server, and neither should need a build
         flag to say so. -->
    <script type="module">
      import init from './guild_overseer_bevy.js';

      const status = document.getElementById('status');
      try {
        await init();
        // Bevy owns the canvas from here; the placeholder would otherwise sit
        // on top of the first frame.
        status.classList.add('gone');
      } catch (error) {
        status.innerHTML =
          '<p>The Bevy client failed to start.</p>' +
          '<p>Check the browser console for details.</p>';
        throw error;
      }
    </script>
  </body>
</html>
