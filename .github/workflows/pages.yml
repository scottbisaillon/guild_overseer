# Publishes the web client to GitHub Pages.
#
# Pages must be set to deploy from GitHub Actions:
# Settings -> Pages -> Source: GitHub Actions.
#
# The build itself lives in `build.yml` and is shared with `ci.yml`, so what is
# published is what a pull request was checked against. This workflow is the
# deploy and the gate in front of it: a build that fails never reaches Pages.
name: Deploy web client to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancelled: a half-finished publish is worse
# than a queued one. Pull request checks have a queue of their own in `ci.yml`
# and cannot sit in front of a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    # Pushes only arrive from main, but workflow_dispatch can be run from any
    # branch, and the github-pages environment refuses deployments from
    # anything but the default branch unless its policy is widened in
    # Settings -> Environments -> github-pages. Stopping here keeps a manual
    # run off a feature branch as a clean build instead of a rejected deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
